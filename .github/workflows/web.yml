name: Build Web App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci
      working-directory: client

    - name: Test
      run: npm test
      working-directory: client

    - name: Build
      run: npm run build
      working-directory: client

    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: web-dist
        path: client/dist/
